# Windows build of the game on every push to master / main (and by hand from the Actions tab).
# Exports the "Windows Desktop" preset with Godot's headless editor and uploads the result as an
# artifact (Actions -> the run -> Artifacts). A tag "v*" also publishes a GitHub release with the zip,
# described by the tagged commit's message.
name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mv templates/* "$templates/"

      - name: Import the project
        run: ./godot --headless --path . --import || true

      - name: Export Windows
        run: |
          mkdir -p build/Royaltim
          ./godot --headless --path . --export-release "Windows Desktop" build/Royaltim/Royaltim.exe
          ls -la build/Royaltim

      - name: Zip
        run: cd build && zip -qr Royaltim-windows.zip Royaltim

      - uses: actions/upload-artifact@v4
        with:
          name: Royaltim-windows
          path: build/Royaltim-windows.zip

      - name: Release notes (the tagged commit's message)
        if: startsWith(github.ref, 'refs/tags/v')
        run: git log -1 --format=%B > build/release_notes.md

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Royaltim ${{ github.ref_name }}
          body_path: build/release_notes.md
          files: build/Royaltim-windows.zip
